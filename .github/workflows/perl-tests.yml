name: Perl tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs cpanfile dependencies into ./local with cpm and caches them,
      # keyed on the cpanfile hash.
      - name: Set up Perl and dependencies
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          install-modules-with: cpm

      - name: Run unit tests (fast loop)
        run: |
          set -euo pipefail
          tests=$(ls t/*.t | grep -v 't/irc_harness_deterministic.t' || true)
          if [ -n "$tests" ]; then
            prove -lr $tests
          fi

      - name: Check isolated coding broker contracts
        run: python3 -m unittest discover -s script/workbench -p 'test_*.py' -v

  irc-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl and dependencies
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          install-modules-with: cpm

      - name: Run deterministic IRC harness wrapper test
        env:
          RUN_IRC_HARNESS_DETERMINISTIC: '1'
        run: prove -lv t/irc_harness_deterministic.t

      - name: Upload IRC harness artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: irc-harness-logs
          path: log/irc-harness/
          if-no-files-found: ignore
